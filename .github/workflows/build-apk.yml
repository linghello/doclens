name: Build APK

# 不需要本机装 WSL / Android SDK —— 全部在 GitHub 的 Ubuntu 机器上跑完，
# 出 APK 后直接当 artifact 下载。适合没有 WSL 的机器。
#
# 用法：
#   1. 把整个 doclens 目录 push 到 GitHub 仓库
#   2. 打开仓库页面 -> Actions -> 左侧 "Build APK" -> Run workflow
#   3. 等 30-90 分钟（首次；之后有缓存只要几分钟）
#   4. 在该次 run 的页面底部 "Artifacts" 里下载 doclens-apk-debug

on:
  workflow_dispatch:
  push:
    branches: [main, master]
    paths:
      - '**.py'
      - 'buildozer.spec'
      - 'assets/**'
      - '.github/workflows/build-apk.yml'

jobs:
  build:
    # 固定在 22.04：24.04 移除了 libtinfo5，buildozer 的 python-for-android
    # 会找不到它而报错。22.04 是官方推荐的打包环境。
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Cache buildozer global dir
        uses: actions/cache@v4
        with:
          path: ~/.buildozer
          key: buildozer-global-${{ hashFiles('buildozer.spec') }}
          restore-keys: buildozer-global-

      - name: Cache buildozer project dir
        uses: actions/cache@v4
        with:
          path: .buildozer
          key: buildozer-project-${{ hashFiles('buildozer.spec') }}
          restore-keys: buildozer-project-

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git zip unzip openjdk-17-jdk \
            autoconf libtool pkg-config \
            zlib1g-dev libncurses-dev libncursesw5-dev libtinfo5 \
            cmake libffi-dev libssl-dev

      - name: Install buildozer
        run: |
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install "buildozer>=1.5.0" "cython<3.0"

      - name: Show buildozer version
        run: buildozer --version

      - name: Build debug APK
        # buildozer 拒绝 root 运行；GH runner 默认就是非 root 用户，无需处理。
        run: buildozer -v android debug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: doclens-apk-debug
          path: bin/*.apk
          if-no-files-found: error
          retention-days: 30
