name: Build APK

# 不需要本机装 WSL / Android SDK —— 全部在 GitHub 的 Ubuntu 机器上跑完，
# 出 APK 后直接当 artifact 下载。
#
# 用法：
#   1. 把整个 doclens 目录 push 到 GitHub 仓库
#   2. 打开仓库页面 -> Actions -> 左侧 "Build APK" -> Run workflow
#   3. 等 30-90 分钟（首次；之后有缓存只要几分钟）
#   4. 在该次 run 的页面底部 "Artifacts" 里下载 doclens-apk-debug

on:
  workflow_dispatch:
  push:
    branches: [main, master]
    paths:
      - '**.py'
      - 'buildozer.spec'
      - 'assets/**'
      - '.github/workflows/build-apk.yml'

jobs:
  build:
    # 固定在 22.04：24.04 移除了 libtinfo5，buildozer 的 python-for-android
    # 会找不到它而报错。22.04 是官方推荐的打包环境。
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # ---------------------------------------------------------------
      # 这一步是必需的，不是优化！
      #
      # GitHub 托管的 ubuntu 运行器**只有约 14 GB 可用磁盘**，而且预装了
      # 一大堆用不上的东西，其中最要命的是 /usr/local/lib/android ——
      # 一份约 6 GB 的 Android SDK。我们用的是 buildozer 自己下载的那份，
      # 这份纯粹占地方。
      #
      # 而 python-for-android 完整编译（hostpython3 + python3 + 所有 recipe
      # + NDK 交叉编译）要 15-20 GB。
      #
      # 第一次构建就是死在磁盘上：日志在 hostpython3 编译到一半时**硬生生截断**，
      # 之后 7 分钟完全没有输出 —— 因为磁盘满了，运行器连日志都写不进去，
      # 所以日志里找不到任何 "No space left on device" 字样，很有迷惑性。
      #
      # ⚠️ 不要删 /opt/hostedtoolcache 整个目录！setup-python 装的 Python
      #    就在里面（/opt/hostedtoolcache/Python/...），删了会找不到解释器。
      #    只删它下面的 CodeQL 子目录。
      # ---------------------------------------------------------------
      - name: Free up disk space
        run: |
          echo "==== 清理前 ===="
          df -h /
          sudo rm -rf /usr/local/lib/android      # 预装 Android SDK，约 6 GB（我们不用）
          sudo rm -rf /usr/share/dotnet           # .NET，约 1.5 GB
          sudo rm -rf /usr/local/.ghcup           # Haskell，约 3 GB
          sudo rm -rf /opt/ghc
          sudo rm -rf /usr/share/swift            # Swift，约 2.5 GB
          sudo rm -rf /opt/hostedtoolcache/CodeQL # 只删 CodeQL，别动 Python
          sudo rm -rf /usr/local/share/boost
          sudo rm -rf /usr/local/share/chromium
          sudo rm -rf /usr/local/share/chrome
          sudo rm -rf /opt/az
          sudo apt-get clean
          echo "==== 清理后 ===="
          df -h /

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # ---------------------------------------------------------------
      # ⚠️ 必须用 JDK 17！GitHub runner 预装了 Java 11 并把 JAVA_HOME
      #    指向它，而 buildozer 使用的 Android Gradle Plugin 要求 Java 17，
      #    否则会在最后 Gradle 阶段报：
      #    > Failed to apply plugin 'com.android.internal.application'.
      #    > Android Gradle plugin requires Java 17 to run. You are
      #      currently using Java 11.
      #    （Run #2 就是死在这）
      #    setup-java 会正确设置 JAVA_HOME 给后续所有步骤。
      # ---------------------------------------------------------------
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Cache buildozer global dir
        uses: actions/cache@v4
        with:
          path: ~/.buildozer
          key: buildozer-global-${{ hashFiles('buildozer.spec') }}
          restore-keys: buildozer-global-

      - name: Cache buildozer project dir
        uses: actions/cache@v4
        with:
          path: .buildozer
          key: buildozer-project-${{ hashFiles('buildozer.spec') }}
          restore-keys: buildozer-project-

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git zip unzip \
            autoconf libtool pkg-config \
            zlib1g-dev libncurses-dev libncursesw5-dev libtinfo5 \
            cmake libffi-dev libssl-dev
          echo "=== JAVA_HOME 校验（必须是 17）==="
          echo "JAVA_HOME=$JAVA_HOME"
          java -version

      - name: Install buildozer
        run: |
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install "buildozer>=1.5.0" "cython<3.0"

      - name: Show buildozer version
        run: buildozer --version

      - name: Show disk before build
        run: df -h /

      - name: Build debug APK
        # buildozer 拒绝 root 运行；GH runner 默认就是非 root 用户，无需处理。
        run: buildozer -v android debug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: doclens-apk-debug
          path: bin/*.apk
          if-no-files-found: error
          retention-days: 30
